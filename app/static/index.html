<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pazaryeri İstihbarat</title>
<style>
body{font-family:Arial,sans-serif;max-width:1180px;margin:28px auto;padding:0 18px;background:#f5f6f8;color:#151515}.header{margin-bottom:18px}.header h1{margin:0 0 7px;font-size:28px}.muted{color:#666;font-size:13px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #0000000b}input{width:calc(100% - 120px);box-sizing:border-box;padding:14px;border:1px solid #d8d8d8;border-radius:10px;font-size:14px}button{padding:14px 20px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700;cursor:pointer}.top{display:flex;gap:8px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f0f2f5;font-size:11px;text-transform:uppercase}.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.metric{background:#f2f3f5;border-radius:12px;padding:14px}.metric b{display:block;font-size:17px;margin-bottom:4px}.metric span{font-size:12px;color:#666}.section-title{font-size:19px;margin:4px 0 14px}.periods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.period{background:#f2f3f5;border-radius:13px;padding:15px}.period h3{margin:0 0 10px;font-size:15px}.sales{font-size:20px;font-weight:800}.revenue{font-size:15px;font-weight:700;margin-top:5px}.small{font-size:11px;color:#666}.analysis-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.why{background:#fafafa;border:1px solid #eee;border-radius:12px;padding:14px}.why ul{margin:8px 0 0;padding-left:20px}.warning{margin-top:12px;padding:12px;border-radius:10px;background:#fff3cd;font-size:12px;color:#6b4e00}.link{font-size:12px;word-break:break-all}.error{background:#fff0f0;color:#a00000;padding:14px;border-radius:10px}.score{font-size:24px;font-weight:800}.center{font-size:22px;font-weight:800}.trend{font-size:16px;font-weight:800}.quality{font-size:12px;color:#555}.commission{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.track-row{display:flex;gap:10px;align-items:center}.track-status{font-size:12px;color:#555}@media(max-width:850px){.commission{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){.product-grid,.periods,.analysis-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.top{display:block}input{width:100%;margin-bottom:8px}.product-grid,.periods,.analysis-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header"><h1>📊 Pazaryeri İstihbarat</h1><div class="muted">Trendyol / Hepsiburada ürün linkini yapıştır ve anında analiz et.</div></div>
<div class="card"><div class="top"><input id="url" placeholder="https://www.trendyol.com/...-p-123456"><button onclick="analyze()">Analiz Et</button></div></div>
<div id="result"></div>
<script>
function money(v){if(v===null||v===undefined)return '—';return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(v)}
function esc(v){return String(v??'—').replace(/[&<>'"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]))}
function period(title,p){if(!p)return '';return `<div class="period"><h3>${title}</h3><div class="sales">${p.sales_low??'—'}–${p.sales_high??'—'} adet</div><div class="revenue">${money(p.revenue_low)} – ${money(p.revenue_high)}</div><div class="small">Tahmini ciro</div></div>`}
function metric(v,l){return `<div class="metric"><b>${esc(v)}</b><span>${esc(l)}</span></div>`}
function evaluateCommission(c){ return c?.rate!=null ? '%' + c.rate : '—'; }
async function toggleTrack(url, isTracked){
  try{
    const r=await fetch('/api/track',{method:isTracked?'DELETE':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.detail||'Takip işlemi başarısız');
    alert(isTracked?'Takipten çıkarıldı.':'Ürün 2 saatlik takip listesine eklendi.');
    analyze();
  }catch(err){ alert(err.message); }
}
async function analyze(){
 const url=document.getElementById('url').value.trim(); if(!url)return;
 document.getElementById('result').innerHTML='<div class="card">Analiz ediliyor…</div>';
 try{
  const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
  const d=await r.json(); if(!r.ok)throw new Error(d.detail||'Analiz başarısız');
  const p=d.product||{},e=d.estimate||{},per=d.periods||{};
  const rank=p.category_rank||p.sales_badge_rank;
  const reasons=(e.reasons||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  document.getElementById('result').innerHTML=`
   <div class="card">
    <span class="badge">${esc(d.marketplace)}</span><h2>${esc(p.title)}</h2>
    <div class="product-grid">
      ${metric(p.price?money(p.price):'—','Satış fiyatı')}
      ${metric(p.list_price?money(p.list_price):'—','Liste fiyatı')}
      ${metric(p.rating??'—','Puan')}
      ${metric(p.review_count??'—','Yorum')}
      ${metric(p.seller||'—','Satıcı')}
      ${metric(p.brand||'—','Marka')}
      ${metric(p.category||'—','Kategori')}
      ${metric(rank?('#'+rank):'—','Kategori/satış sırası')}
      ${metric(p.category_rank_source||'—','Sıra veri kaynağı')}
    </div>
    ${p.category_url?`<div class="link" style="margin-top:10px">Kategori: ${esc(p.category_url)}</div>`:''}
    <div class="track-row" style="margin-top:12px">
      <button onclick="toggleTrack(${JSON.stringify(url)}, ${d.tracked?'true':'false'})">${d.tracked?'Takipte ✓':'2 Saatlik Takibe Al'}</button>
      <span class="track-status">${d.tracked?'Bu ürün otomatik takip listesinde.':'Butona basınca GitHub tabanlı 2 saatlik takip listesine eklenir.'}</span>
    </div>
   </div>
   <div class="card">
    <div class="section-title">Satış ve Ciro Tahmini</div>
    <div class="periods">
      ${period('Günlük',per.daily)}${period('3 Günlük',per['3_days'])}${period('7 Günlük',per['7_days'])}${period('Aylık',per.monthly)}
    </div>
    <div class="analysis-grid">
      ${metric(e.daily_estimate??'—','Tahmini günlük merkez')}
      ${metric('%'+(e.confidence??0),'Tahmin güveni')}
      ${metric((e.score??0)+'/100','Satış potansiyeli')}
      ${metric(d.trend?.label||'—','Trend')}
    </div>
    <div class="why" style="margin-top:10px"><b>Neden bu tahmin?</b><ul>${reasons||'<li>Yeterli sinyal yok.</li>'}</ul></div>
    <div class="analysis-grid">
      ${metric(p.purchase_signal_24h??'—','Açık 24s satış sinyali')}
      ${metric(p.sold_total_signal??'—','Açık toplam satış sinyali')}
      ${metric(p.sales_badge?((p.sales_badge_rank?'#'+p.sales_badge_rank+' ':'')+p.sales_badge):'—','Pazaryeri etiketi')}
      ${metric(d.history?.snapshots??0,'Takip snapshot')}
      ${metric(e.basis||'—','Tahmin yöntemi')}
    </div>
    ${d.trend?.detail?`<div class="quality" style="margin-top:10px"><b>Trend detayı:</b> ${esc(d.trend.detail)}</div>`:''}
    <div class="warning">⚠️ Bu rakamlar tahmindir; rakip mağazanın gerçek sipariş adedi değildir. Stok toplamı tek başına satış olarak kabul edilmez. Açık satış sinyali bulunmadığında sonuç model tahminidir.</div>
   </div>
   <div class="card">
    <div class="section-title">Komisyon</div>
    <div class="commission">
      ${metric(evaluateCommission(d.commission),'Komisyon oranı')}
      ${metric(d.commission?.amount_on_current_price!=null?money(d.commission.amount_on_current_price):'—','Mevcut fiyatta komisyon')}
      ${metric(d.commission?.label||'—','Eşleşen kategori')}
      ${metric(d.commission?.source||'—','Kaynak')}
    </div>
    <div class="quality" style="margin-top:10px">${esc(d.commission?.note||'')}</div>
   </div>
   <div class="card"><b>Veri kalitesi</b><div class="quality" style="margin-top:8px">Tahmin seviyesi: ${esc(e.evidence_level||'—')} · ${esc(d.message||'')}</div><div class="quality" style="margin-top:6px">Not: Satış potansiyeli popülerlik göstergesidir; tahmini satış adedi değildir.</div></div>`;
 }catch(err){document.getElementById('result').innerHTML=`<div class="card"><div class="error">${esc(err.message)}</div></div>`}
}
</script>
</body>
</html>
